# Reconstrucción del sitio al publicar contenido.
#
# El sitio es HTML estático: un post nuevo en el admin de Django no se ve
# hasta que Astro vuelve a compilar. Django dispara este workflow con un
# repository_dispatch (ver apps/api/core/webhooks.py).
#
# Solo reconstruye el FRONTEND. La API no cambió: reconstruirla y reiniciarla
# por un post nuevo sería cortar la conexión de los visitantes para nada.

name: Reconstruir contenido

on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

concurrency:
  group: content-rebuild
  cancel-in-progress: true # aquí SÍ: si llegan tres, solo importa la última

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  rebuild:
    name: Reconstruir y publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Calcular el nombre de la imagen
        run: |
          IMAGE=$(echo "${{ env.IMAGE_BASE }}-web" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Igual que en deploy.yml: el token va como secreto de BuildKit y no
      # como build-arg, porque `docker history` expondría un build-arg en
      # una imagen pública.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: prod
          push: true
          build-args: |
            PUBLIC_API_URL=https://pedrinidev.com/api/v1
            PUBLIC_SITE_URL=https://pedrinidev.com
          secrets: |
            build_token=${{ secrets.BUILD_API_TOKEN }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Actualizar el sitio en el droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            cd /srv/mysite
            export WEB_IMAGE="${{ steps.meta.outputs.image }}:${{ github.sha }}"
            docker compose -f compose.prod.yml pull web
            docker compose -f compose.prod.yml up -d web
