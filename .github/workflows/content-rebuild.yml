# Reconstrucción del sitio al publicar contenido.
#
# El sitio es HTML estático: un post nuevo en el admin de Django no se ve
# hasta que Astro vuelve a compilar. Django dispara este workflow con un
# repository_dispatch (ver apps/api/core/webhooks.py).
#
# Solo reconstruye el FRONTEND. La API no cambió: reconstruirla y reiniciarla
# por un post nuevo sería cortar la conexión de los visitantes para nada.

name: Reconstruir contenido

on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

concurrency:
  group: content-rebuild
  cancel-in-progress: true # aquí SÍ: si llegan tres, solo importa la última

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  rebuild:
    name: Reconstruir y publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Calcular nombre y versión de la imagen
        run: |
          IMAGE=$(echo "${{ env.IMAGE_BASE }}-web" | tr '[:upper:]' '[:lower:]')
          VERSION="$(date -u +%Y.%m.%d)-$(echo "${{ github.sha }}" | cut -c1-7)-contenido"
          echo "ref=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publicando: $IMAGE:$VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Igual que en deploy.yml: el token va como secreto de BuildKit y no
      # como build-arg, porque `docker history` expondría un build-arg en
      # una imagen pública.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: prod
          push: true
          build-args: |
            PUBLIC_API_URL=https://pedrinidev.com/api/v1
            PUBLIC_SITE_URL=https://pedrinidev.com
            CONTENT_STAMP=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            build_token=${{ secrets.BUILD_API_TOKEN }}
          # El sufijo «-contenido» distingue las reconstrucciones por
          # publicación de las de un cambio de código: mismo commit, sitio
          # distinto. Sin él, dos publicaciones seguidas del mismo commit
          # producirían la misma etiqueta y no se sabría cuál está viva.
          tags: ${{ steps.meta.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Actualizar el sitio en el droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            cd /srv/mysite
            WEB_IMAGE="${{ steps.meta.outputs.ref }}"
            export WEB_IMAGE

            touch .env
            grep -v '^WEB_IMAGE=' .env > .env.nuevo || true
            echo "WEB_IMAGE=$WEB_IMAGE" >> .env.nuevo
            mv .env.nuevo .env
            chmod 600 .env

            docker compose -f compose.prod.yml pull web
            # --no-deps: `web` declara depends_on api, y sin esto se
            # recrearía también la API con la imagen por defecto.
            docker compose -f compose.prod.yml up -d --no-deps web
