# Sitio pedrinidev.com
#
# Nginx cumple tres funciones: termina el TLS, sirve el HTML estático desde
# disco y hace de proxy hacia Gunicorn solo para /api/ y /admin/.
#
# Reparto real de trabajo: el 95 % de las peticiones las resuelve Nginx desde
# disco sin tocar Python. Eso es lo que permite que un droplet de 512 MB
# aguante el tráfico de un portafolio sin despeinarse.

upstream django {
    server api:8000;
    keepalive 8;
}

# Mapa para la caché: los assets con hash en el nombre son inmutables.
map $uri $cache_control {
    default                     "public, max-age=0, must-revalidate";
    ~*^/_astro/                 "public, max-age=31536000, immutable";
    ~*\.(?:woff2?|ttf|otf)$     "public, max-age=31536000, immutable";
    ~*\.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ "public, max-age=2592000";
}

# ─────────────────── HTTP: solo redirección y ACME ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pedrinidev.com www.pedrinidev.com;

    # Certbot en modo webroot necesita servir este directorio por HTTP puro.
    # Es la única ruta que NO se redirige a HTTPS: si se redirigiera, la
    # renovación del certificado fallaría cada 60 días.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ────────────────────────── HTTPS ───────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pedrinidev.com www.pedrinidev.com;

    ssl_certificate     /etc/letsencrypt/live/pedrinidev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedrinidev.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # con TLS 1.3, la elección del cliente es la buena
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /srv/web;
    index index.html;

    limit_conn perip 20;

    # ── Cabeceras de seguridad ────────────────────────────────
    # Ver security_headers.conf: se incluye TAMBIÉN en cada location que
    # añada cabeceras propias, porque add_header no se hereda cuando el
    # nivel hijo define alguna.
    include /etc/nginx/security_headers.conf;

    # ── Healthcheck (no se registra: corre cada 30 s) ──────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ── API ───────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://django;
    }

    # Endpoints de escritura: límite mucho más estricto.
    # Es la primera línea de defensa; el throttling de DRF es la segunda.
    # Dos capas, porque la de Nginx frena el abuso ANTES de gastar un hilo
    # de Gunicorn y una consulta a SQLite.
    location ~ ^/api/v1/(contact|games/[^/]+/(session|scores/submit))/ {
        limit_req zone=writes burst=5 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://django;
    }

    # ── Admin de Django ───────────────────────────────────────
    #
    # La ruta NO está escrita a mano: llega en ${ADMIN_PATH} y la sustituye
    # el arranque de la imagen de Nginx. Tenerla fija en /admin/ anulaba por
    # completo la ruta secreta de DJANGO_ADMIN_URL — Nginx no reenviaba la
    # ruta buena (404 del sitio estático) y sí reenviaba /admin/, donde
    # Django ya no tiene nada. El panel quedaba inalcanzable por los dos
    # lados a la vez.
    location /${ADMIN_PATH} {
        limit_req zone=admin burst=10 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://django;
    }

    # Estáticos del admin, servidos por WhiteNoise a través de Gunicorn.
    location /static/ {
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/security_headers.conf;
        proxy_pass http://django;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # ── Media: servida por Nginx directamente desde el volumen ─
    # Hacer pasar imágenes por Gunicorn ocuparía hilos que hacen falta para
    # peticiones reales de la API.
    location /media/ {
        alias /data/media/;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Sitio estático ────────────────────────────────────────
    location / {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control $cache_control always;

        # El orden importa:
        #   $uri            → archivo exacto (assets)
        #   $uri/index.html → build en formato 'directory' (/es/proyectos/)
        #   $uri.html       → tolera la URL sin barra final (/es/proyectos)
        #   =404            → dispara error_page, que sirve /404.html CON
        #                     código 404. Poner /404.html aquí directamente
        #                     serviría la página con un 200, y Google
        #                     indexaría páginas de error como válidas.
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Nunca servir archivos ocultos: .env, .git, .DS_Store…
    location ~ /\. {
        deny all;
        access_log off;
    }
}
