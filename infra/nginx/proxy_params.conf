# Cabeceras del proxy hacia Gunicorn. Incluido desde cada location de proxy.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;

# X-Real-IP lo SOBRESCRIBE Nginx con la IP de la conexión TCP real, así que el
# cliente no puede falsificarlo. Es el valor que usa core/security.py para
# limitar abuso y para hashear.
#
# X-Forwarded-For se pasa por convención, pero NO debe usarse para decidir
# nada: conserva lo que envió el cliente y le añade el salto real al final,
# de modo que un atacante puede inyectar entradas falsas al principio.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Sin esto, Django cree que la petición es HTTP y SECURE_SSL_REDIRECT provoca
# un bucle infinito de redirecciones.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 8 8k;

proxy_redirect off;
