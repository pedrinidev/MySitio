# Cabeceras de seguridad.
#
# Están en un archivo aparte por una trampa real de Nginx: las directivas
# `add_header` se heredan del nivel superior SOLO si el nivel actual no
# define ninguna. Basta con que un `location` añada su propio `Cache-Control`
# para que pierda TODAS las cabeceras de seguridad del bloque `server`.
#
# Es un fallo silencioso: la configuración carga sin errores y el sitio
# funciona, pero se publica sin HSTS ni CSP. Por eso este archivo se incluye
# explícitamente en cada location que añada cabeceras propias.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# CSP.
#
# `script-src` incluye 'unsafe-inline' y es una concesión consciente: el sitio
# tiene tres scripts en línea (JSON-LD, la redirección de idioma y el beacon
# de lecturas). Quitarla exige moverlos a archivos externos o post-procesar el
# build para inyectar hashes.
#
# Todo lo demás sí está cerrado: sin objetos, sin iframes ajenos, sin <base>
# manipulable y conexiones solo al propio origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
