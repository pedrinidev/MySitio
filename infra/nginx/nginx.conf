# Configuración global de Nginx.
#
# Ajustada para un droplet de 1 vCPU y 512 MB: un solo worker, pocas
# conexiones y compresión agresiva. Multiplicar workers en un único núcleo
# solo añade cambios de contexto.

user nginx;
worker_processes 1;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $http_x_real_ip no: se registra la IP de la conexión real.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;

    # No revelar la versión de Nginx: es reconocimiento gratis para un atacante.
    server_tokens off;

    client_max_body_size 6m;   # coherente con DATA_UPLOAD_MAX_MEMORY_SIZE de Django
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 20s;

    # ── Compresión ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;   # 6 es el punto dulce; 9 gasta CPU para ganar ~2 %
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ── Zonas de limitación de peticiones ─────────────────────
    # Se definen aquí (ámbito http) y se aplican por location en site.conf.
    # La memoria es compartida entre workers: 10 MB ≈ 160 000 direcciones.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=writes:5m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin:5m rate=30r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    include /etc/nginx/conf.d/*.conf;
}
